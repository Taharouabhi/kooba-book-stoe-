<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وصل حديثاً — مكتبة القبة</title>
<meta name="description" content="أحدث الإصدارات والكتب الواصلة حديثاً إلى مكتبة القبة.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="new">
<div id="site-header"></div>

<main class="container">
  <div class="hero-head">
    <h1 class="page-title">وصل حديثاً</h1>
    <p class="page-sub">أحدث الإصدارات التي وصلت إلى رفوفنا هذا الشهر، مختارة بعناية لعشاق القراءة.</p>
  </div>
  <section class="section">
    <div class="grid grid-4" id="grid"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script>
  const D = window.KBS.D;
  function render(){
    document.getElementById('grid').innerHTML =
      D.books.filter(b => b.isNew).map(window.KBS.renderers.productCard).join('');
  }
  render();
  window.KBS_API.refreshCatalog(render);
</script>
</body>
</html>
