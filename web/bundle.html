<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الباقة — مكتبة القبة</title>
<meta name="description" content="تفاصيل باقة الكتب ومحتوياتها وسعرها المخفض.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="bundles">
<div id="site-header"></div>

<main class="container">
  <nav class="crumbs green" style="padding-block:22px 0" aria-label="مسار التنقل">
    <a href="index.html">الرئيسية</a><span class="sep">/</span>
    <a href="bundles.html">باقات الكتب</a><span class="sep">/</span>
    <span class="current" id="crumbCur">الباقة</span>
  </nav>

  <section class="pd" style="padding-block:26px" id="pk"></section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">قد يعجبك أيضاً</h2></div>
    <div class="grid grid-3" id="moreBundles"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function(){
  const K = window.KBS, D = K.D, R = K.renderers;
  const id = new URLSearchParams(location.search).get('id') || 'pk3';

  function render(){
    const pk = D.bundles.find(x => x.id === id) || D.bundles[0];
    if (!pk) return;
    document.title = pk.name + ' — مكتبة القبة';
    document.getElementById('crumbCur').textContent = pk.name;
    const books = pk.bookIds.map(bid => D.books.find(b => b.id === bid)).filter(Boolean);
    const sum = books.reduce((s,b)=>s+b.price,0);

    document.getElementById('pk').innerHTML = `
    <div class="pd-gallery">
      <div class="pd-main-img" style="aspect-ratio:auto;padding:34px">
        <span class="bcard-badge" style="position:static;margin-bottom:18px">وفّر ${pk.save}%</span>
        <div class="bcard-stack" style="height:220px;margin:0">${pk.covers.slice(0,3).map(c=>`<img src="${K.u(D.img(c))}" alt="">`).join('')}</div>
      </div>
    </div>
    <div class="pd-info">
      <h1>${K.esc(pk.name)}</h1>
      <div class="pd-author">${pk.count} كتب مختارة</div>
      <p class="pd-desc">${K.esc(pk.desc)}</p>
      <div class="pd-price">
        <span class="now">${K.formatDZD(pk.price)}</span>
        <span class="was">${K.formatDZD(pk.old)}</span>
        <span class="save">وفّر ${pk.save}%</span>
      </div>
      <div class="pd-buy">
        <button class="btn btn-primary btn-lg" data-add-bundle="${pk.id}">${K.icon('cart')} أضف الباقة إلى السلة</button>
      </div>
      <hr class="divider">
      <h3 style="font-family:var(--f-serif);font-size:20px;margin-bottom:8px">محتويات الباقة</h3>
      ${books.map(b => `
        <div class="mini-item">
          <span class="thumb"><img src="${K.u(b.coverUrl)}" alt=""></span>
          <div class="ci-info">
            <div class="ci-title" style="font-size:16px"><a href="book.html?id=${b.id}">${K.esc(b.title)}</a></div>
            <div class="ci-meta">${K.esc(b.author)}</div>
          </div>
          <span class="ci-price" style="margin:0">${K.formatDZD(b.price)}</span>
        </div>`).join('')}
      <div class="sum-row total" style="border-top:none">
        <span>قيمة الكتب منفردة</span><span class="v">${K.formatDZD(sum || pk.old)}</span>
      </div>
      <div class="sum-row total">
        <span>سعر الباقة</span><span class="v">${K.formatDZD(pk.price)}</span>
      </div>
    </div>`;

    document.getElementById('moreBundles').innerHTML =
      D.bundles.filter(x => x.id !== pk.id && x.active).slice(0,3).map(R.bundleCard).join('');
  }
  render();
  KBS_API.refreshCatalog(render);
})();
</script>
</body>
</html>
