<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دخول المشرف — Kouba Book Store</title>
<meta name="description" content="بوابة دخول المشرف إلى لوحة تحكم مكتبة القبة.">
<link rel="icon" href="../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="loginForm">
    <div class="auth-bar"></div>
    <div class="auth-body">
      <img class="auth-logo" src="../assets/img/logo-lg.png" alt="مكتبة القبة">
      <h1 class="auth-title">Kouba Book Store</h1>
      <p class="auth-sub">لوحة تحكم المشرف — سجّل دخولك لإدارة المتجر</p>
      <div class="field mb-3">
        <label for="email">البريد الإلكتروني</label>
        <input class="input latin" dir="ltr" id="email" type="email" value="admin@koubabookstore.dz" required>
      </div>
      <div class="field mb-3">
        <label for="pass">كلمة المرور</label>
        <input class="input latin" dir="ltr" id="pass" type="password" autocomplete="current-password" required>
      </div>
      <p class="auth-err" id="loginErr" hidden></p>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">تسجيل الدخول</button>
    </div>
  </form>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn'), err = document.getElementById('loginErr');
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'جارٍ التحقق…';
    const r = await KBS_API.request('admin.login', {
      body: {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('pass').value
      }
    });
    if (r.ok && r.data && r.data.token) {
      KBS_API.setAdminToken(r.data.token);
      location.href = 'index.html';
      return;
    }
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول';
    err.hidden = false;
    err.textContent = KBS_API.isOutcomeUnknown(r)
      ? 'تعذّر الاتصال بالخادم، تحقق من اتصالك وحاول مرة أخرى.'
      : KBS_API.msg(r.error);
    document.getElementById('pass').value = '';
    document.getElementById('pass').focus();
  });
</script>
</body>
</html>
